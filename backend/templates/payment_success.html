<!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>تم الدفع - ALSAAB AI</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(circle at 20% 20%, rgba(214,168,79,0.16), transparent 30%),
                    linear-gradient(135deg, #03050a, #0a0f1d);
                color: #fff;
                font-family: Arial, sans-serif;
                padding: 24px;
            }
            .card {
                max-width: 620px;
                background: rgba(255,255,255,0.06);
                border: 1px solid rgba(214,168,79,0.38);
                border-radius: 24px;
                padding: 32px;
                text-align: center;
                box-shadow: 0 24px 70px rgba(0,0,0,0.48);
            }
            h1 {
                margin-top: 0;
                color: #f3d37b;
                font-size: 28px;
            }
            p {
                color: #cbd5e1;
                line-height: 1.9;
                font-size: 16px;
            }
            .note {
                margin-top: 18px;
                color: #94a3b8;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>تم الدفع بنجاح ✅</h1>
            <p>
                اشتراكك في ALSAAB AI قيد التفعيل الآن.
                ارجع للمحادثة واكتب: <strong>تدريب البوت</strong>
                عشان نجهز النظام لمشروعك خطوة خطوة.
            </p>
            <div class="note">
                إذا ما تفعل الاشتراك مباشرة، انتظر دقيقة ثم جرب مرة ثانية.
            </div>
        </div>
    </body>
    </html>
